version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/flowplan.lpk
  target_arch: amd64

# 版本跟随上游镜像 tag
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: flowplan

build:
  run_buildscript: false

images:
  - id: flowplan
    target: service
    service: flowplan
    source: ghcr.io/yannicschuller/flowplan
    channel: stable
    tag_regex: '^\d+\.\d+\.\d+$'
    version_regex: '^(?P<version>\d+\.\d+\.\d+)$'
    delivery:
      # 官方商店要求镜像来自 registry.lazycat.cloud，由 Action 自动转存
      mode: lazycat

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Flowplan
    summary: "开源自托管的 Notion / AppFlowy 替代品：文档、数据库、白板与每日手账"
